<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Acerola">
  <defs>
    <linearGradient id="acerola-body" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e65f6a"/>
      <stop offset="0.55" stop-color="#df3340"/>
      <stop offset="1" stop-color="#a0242e"/>
    </linearGradient>
    <linearGradient id="acerola-accent" x1="0" x2="0.9" y1="0" y2="1">
      <stop offset="0" stop-color="#9be07b"/>
      <stop offset="1" stop-color="#82d95b"/>
    </linearGradient>
    <radialGradient id="acerola-shine" cx="30%" cy="22%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="acerola-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#e45762" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#8edc6b" stop-opacity="0"/>
    </radialGradient>
    <filter id="acerola-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="acerola-shadow" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#05150d" flood-opacity="0.32"/>
    </filter>
  </defs>
  <ellipse cx="256" cy="272" rx="168" ry="152" fill="url(#acerola-glow)" filter="url(#acerola-blur)"/>
  <ellipse cx="256" cy="438" rx="116" ry="26" fill="rgba(0,0,0,.18)"/>
  
  <g filter="url(#acerola-shadow)">
    <path d="M208 176c-18 78 16 139 97 177" fill="none" stroke="#6f4c25" stroke-width="12" stroke-linecap="round"/>
    <path d="M304 176c10 67 48 103 100 120" fill="none" stroke="#6f4c25" stroke-width="12" stroke-linecap="round"/>
    <circle cx="206" cy="322" r="72" fill="url(#acerola-body)" stroke="#a0242e" stroke-width="16"/>
    <circle cx="318" cy="297" r="66" fill="#e24753" stroke="#a0242e" stroke-width="16"/>
    <ellipse cx="184" cy="282" rx="26" ry="40" fill="url(#acerola-shine)" opacity=".34"/>
  </g>
</svg>