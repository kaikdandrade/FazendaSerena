    <circle cx="206" cy="267" r="54" fill="url(#algodao-body)" stroke="#b2b2ac" stroke-width="14"/><circle cx="286" cy="237" r="58" fill="#f9f9f2" stroke="#b2b2ac" stroke-width="14"/><circle cx="326" cy="318" r="50" fill="url(#algodao-body)" stroke="#b2b2ac" stroke-width="14"/>
