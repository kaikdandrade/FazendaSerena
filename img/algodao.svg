<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Algodão">
  <defs>
    <linearGradient id="algodao-body" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f9f9f3"/>
      <stop offset="0.55" stop-color="#f8f8f0"/>
      <stop offset="1" stop-color="#b2b2ac"/>
    </linearGradient>
    <linearGradient id="algodao-accent" x1="0" x2="0.9" y1="0" y2="1">
      <stop offset="0" stop-color="#abdda2"/>
      <stop offset="1" stop-color="#97d58b"/>
    </linearGradient>
    <radialGradient id="algodao-shine" cx="30%" cy="22%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="algodao-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#f9f9f2" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#a1d996" stop-opacity="0"/>
    </radialGradient>
    <filter id="algodao-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="algodao-shadow" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#05150d" flood-opacity="0.32"/>
    </filter>
  </defs>
  <ellipse cx="256" cy="272" rx="168" ry="152" fill="url(#algodao-glow)" filter="url(#algodao-blur)"/>
  <ellipse cx="256" cy="438" rx="116" ry="26" fill="rgba(0,0,0,.18)"/>
  
