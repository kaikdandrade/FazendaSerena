<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cereja">
  <defs>
    <linearGradient id="cereja-body" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c84463"/>
      <stop offset="0.55" stop-color="#b91037"/>
      <stop offset="1" stop-color="#850b27"/>
    </linearGradient>
    <linearGradient id="cereja-accent" x1="0" x2="0.9" y1="0" y2="1">
      <stop offset="0" stop-color="#96de7b"/>
      <stop offset="1" stop-color="#7cd65b"/>
    </linearGradient>
    <radialGradient id="cereja-shine" cx="30%" cy="22%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
