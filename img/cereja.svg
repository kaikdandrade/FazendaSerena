    <radialGradient id="cereja-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#c53b5b" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#89da6b" stop-opacity="0"/>
