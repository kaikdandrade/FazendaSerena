<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Trigo">
  <defs>
    <linearGradient id="trigo-body" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f2d47e"/>
      <stop offset="0.55" stop-color="#efc95a"/>
      <stop offset="1" stop-color="#ac9040"/>
    </linearGradient>
    <linearGradient id="trigo-accent" x1="0" x2="0.9" y1="0" y2="1">
      <stop offset="0" stop-color="#9fd085"/>
      <stop offset="1" stop-color="#88c567"/>
    </linearGradient>
    <radialGradient id="trigo-shine" cx="30%" cy="22%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="trigo-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#f1d277" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#93ca76" stop-opacity="0"/>
    </radialGradient>
    <filter id="trigo-blur" x="-40%" y="-40%" width="180%" height="180%">
