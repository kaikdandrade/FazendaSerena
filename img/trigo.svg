    </filter>
  </defs>
  <ellipse cx="256" cy="272" rx="168" ry="152" fill="url(#trigo-glow)" filter="url(#trigo-blur)"/>
  <ellipse cx="256" cy="438" rx="116" ry="26" fill="rgba(0,0,0,.18)"/>
  
