    <ellipse cx="226" cy="196" rx="18" ry="44" transform="rotate(-18 226 196)" fill="url(#trigo-body)" stroke="#ac9040" stroke-width="8"/><ellipse cx="266" cy="220" rx="18" ry="44" transform="rotate(0 266 220)" fill="url(#trigo-body)" stroke="#ac9040" stroke-width="8"/><ellipse cx="222" cy="286" rx="18" ry="44" transform="rotate(-15 222 286)" fill="url(#trigo-body)" stroke="#ac9040" stroke-width="8"/><ellipse cx="287" cy="292" rx="18" ry="44" transform="rotate(18 287 292)" fill="url(#trigo-body)" stroke="#ac9040" stroke-width="8"/><ellipse cx="251" cy="154" rx="18" ry="44" transform="rotate(8 251 154)" fill="url(#trigo-body)" stroke="#ac9040" stroke-width="8"/>
